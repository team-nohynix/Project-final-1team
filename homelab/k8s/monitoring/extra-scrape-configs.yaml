# kube-prometheus-stack의 기본 스크레이프는 ServiceMonitor 기반이라 job 이름이
# "<namespace>/<servicemonitor>-<port>"처럼 길어진다 — 기존 team1-overview.json
# 대시보드가 기대하는 job="orderapi"/"matching-engine"/"recorder"와 안 맞는다.
# kubernetes_sd_configs(role: endpoints)를 직접 써서 prometheus.io/scrape
# annotation이 붙은 Service만 골라 스크레이프하고, relabel로 job 이름을 그
# Service의 app 라벨로 강제 고정한다 — Docker Compose 시절 prometheus.yml의
# job 이름과 정확히 같게 맞춰서 대시보드를 그대로 재사용할 수 있게 한다.
apiVersion: v1
kind: Secret
metadata:
  name: additional-scrape-configs
  namespace: monitoring
type: Opaque
stringData:
  extra.yaml: |
    - job_name: 'k8s-app-endpoints'
      kubernetes_sd_configs:
        - role: endpoints
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - source_labels: [__meta_kubernetes_service_label_app]
          target_label: job
