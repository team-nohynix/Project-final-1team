# job-trigger 자신의 ServiceAccount — infra/k8s/job-trigger-rbac.yaml의 Role을
# 이 계정에 바인딩한다(homelab/k8s/job-trigger/rbac.yaml 참고). AWS에서는 이
# 권한이 Lambda 실행 역할(IAM)에 있었지만, 여기서는 job-trigger가 클러스터
# 안의 파드로 직접 떠서 자기 ServiceAccount 토큰으로 K8s API를 인증한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-trigger
  namespace: ai-trader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-trigger
  namespace: ai-trader
  labels:
    app: job-trigger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-trigger
  template:
    metadata:
      labels:
        app: job-trigger
    spec:
      serviceAccountName: job-trigger
      containers:
        - name: job-trigger
          image: truss-job-trigger:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: job-trigger
  namespace: ai-trader
spec:
  selector:
    app: job-trigger
  ports:
    - port: 9000
      targetPort: 9000
