# infra/k8s/collector/backend-deployment.yaml을 홈서버용으로 이식(2026-08-26) —
# APP_ENV=dev로 로컬 스토리지 폴백(S3_BUCKET 불필요, backend/Dockerfile의
# WORKDIR 수정 이후 정상 동작 확인됨).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: collector
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: sa-collector
      # hostPath 볼륨은 Docker named volume과 달리 이미지의 기존 디렉터리
      # 소유권을 상속하지 않는다 — kubelet이 DirectoryOrCreate로 처음 만들 때
      # root 소유로 생성되어 appuser(10001)가 mkdir/쓰기를 못 한다(2026-08-26
      # 실측 — "mkdir data/KRW-XRP: permission denied"). 매번 손으로 chown하는
      # 대신 initContainer가 매 파드 시작마다 보장하게 한다.
      initContainers:
        - name: fix-data-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10001:10001 /app/data"]
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: backend
          image: truss-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          hostPath:
            path: /var/lib/truss/collector-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: collector
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
