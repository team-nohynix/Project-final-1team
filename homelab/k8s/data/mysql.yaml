# homelab/docker-compose.yml의 mysql 서비스를 그대로 이식 — 설정값은 이미 검증됨.
# schema.sql은 ConfigMap(mysql-schema)으로 kubectl create configmap --from-file 로
# 별도 생성한다(homelab/k8s/README 또는 배포 스크립트 참고) — mysql 공식 이미지의
# /docker-entrypoint-initdb.d 최초 기동 메커니즘을 그대로 재사용.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--max_connections=200", "--skip-log-bin"]
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: MYSQL_DATABASE
              value: team1_truss
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: schema
          configMap:
            name: mysql-schema
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: data
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
