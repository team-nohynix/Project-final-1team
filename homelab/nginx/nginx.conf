# infra/edge.tf(CloudFront)의 라우팅 규칙을 그대로 이식 — 세 개의
# ordered_cache_behavior(/order-api/*, /recorder-api/*, /v1/*) + 기본 정적
# 파일 서빙(+ SPA fallback, spa_fallback CloudFront Function과 동일 로직).
#
# kubeadm 이전(2026-08-26) 이후: 업스트림을 Docker Compose 서비스명(orderapi/
# recorder/backend)에서 K8s Service FQDN으로 교체 — orderapi/recorder는
# backend 네임스페이스, backend(시세 수집기)는 collector 네임스페이스라
# 짧은 이름으로는 못 부르고 <service>.<namespace>.svc.cluster.local이 필요.
# 이 파드 자체는 ingress-nginx 뒤에서 K8s Service로 노출되고(homelab/k8s/
# ingress 참고), 안쪽 라우팅(=/order-api, /recorder-api, /v1)은 이 nginx.conf가
# CloudFront 시절과 동일하게 계속 처리한다 — Ingress 레벨에서 경로를 또 쪼개지
# 않고 검증된 로직을 그대로 재사용.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    # /order-api/* → 접두사 제거 → orderapi.backend.svc.cluster.local:8081
    location /order-api/ {
        rewrite ^/order-api/?(.*)$ /$1 break;
        proxy_pass http://orderapi.backend.svc.cluster.local:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /recorder-api/* → 접두사 제거 → recorder.backend.svc.cluster.local:8082 (조회 전용 API)
    location /recorder-api/ {
        rewrite ^/recorder-api/?(.*)$ /$1 break;
        proxy_pass http://recorder.backend.svc.cluster.local:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /v1/* (접두사 없이 직접) → 시세 수집기(backend.collector.svc.cluster.local:8080) — 프론트가 MarketStreamView 등에서 직접 호출
    location /v1/ {
        proxy_pass http://backend.collector.svc.cluster.local:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 나머지는 프론트 정적 파일 — 확장자 없는 경로(라우터 딥링크)는 index.html로
    # 폴백한다(spa_fallback CloudFront Function과 동일 로직).
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
