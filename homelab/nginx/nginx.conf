# infra/edge.tf(CloudFront)의 라우팅 규칙을 그대로 이식 — 세 개의
# ordered_cache_behavior(/order-api/*, /recorder-api/*, /v1/*) + 기본 정적
# 파일 서빙(+ SPA fallback, spa_fallback CloudFront Function과 동일 로직).
#
# CloudFront와 다른 점: 거긴 orderapi/recorder가 같은 ALB+K8s Ingress를 공유해서
# /recorder-api도 orderapi ALB로 갔지만(그 안에서 K8s Ingress가 경로별로
# 다시 갈랐다), 여기는 K8s Ingress 계층이 없으므로 recorder 컨테이너로 직접 보낸다
# — 최종 목적지는 동일(recorder 조회 API), 경유지만 한 단계 짧아졌다.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    # /order-api/* → 접두사 제거 → orderapi:8081
    location /order-api/ {
        rewrite ^/order-api/?(.*)$ /$1 break;
        proxy_pass http://orderapi:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /recorder-api/* → 접두사 제거 → recorder:8082 (조회 전용 API)
    location /recorder-api/ {
        rewrite ^/recorder-api/?(.*)$ /$1 break;
        proxy_pass http://recorder:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /v1/* (접두사 없이 직접) → 시세 수집기(backend:8080) — 프론트가 MarketStreamView 등에서 직접 호출
    location /v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 나머지는 프론트 정적 파일 — 확장자 없는 경로(라우터 딥링크)는 index.html로
    # 폴백한다(spa_fallback CloudFront Function과 동일 로직).
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
