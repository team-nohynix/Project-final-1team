# 매칭 엔진 — 앱 팀원이 올린 matching-latest 이미지. 환경변수는 앱 팀원이 전달한
# "AWS 리소스·권한·계정 정리" 문서(2026-08-11) 기준 — Kafka는 KAFKA_USE_IAM_AUTH=true
# 하나로 IAM 인증을 켜고(KAFKA_SECURITY_PROTOCOL/SASL_MECHANISM은 앱이 안 읽음), Redis는
# TLS만 필수(AUTH 토큰 없음)라 REDIS_TLS_ENABLED=true만 준다. replicas는 KEDA
# ScaledObject(keda-scaledobjects.yaml)가 컨슈머 랙 기준으로 조절 — 여기 값은
# minReplicaCount와 맞춰야 한다(지금 1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  namespace: backend
  labels:
    app: matching-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-engine
  template:
    metadata:
      labels:
        app: matching-engine
    spec:
      serviceAccountName: sa-matching-engine
      tolerations:
        - key: workload
          value: backend
          effect: NoSchedule
      nodeSelector:
        team1.io/workload: backend
      containers:
        - name: matching-engine
          image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team1-truss:matching-latest
          # 태그가 문자 그대로 "latest"가 아니라 "matching-latest"라 K8s 기본
          # imagePullPolicy가 IfNotPresent — 재배포해도 노드에 캐시된 예전 이미지를
          # 그대로 쓰는 걸 실측으로 발견(팀원이 새 이미지 푸시했는데도 파드가 예전
          # digest로 뜸). :xxx-latest 태그를 계속 재사용하는 이 프로젝트 관례상
          # Always가 맞다.
          imagePullPolicy: Always
          env:
            # 2026-08-24: MSK 재생성 때마다 바뀌는 값이라 리터럴 대신 terraform이
            # 관리하는 ConfigMap(infra/k8s-addons.tf의 backend-cluster-config)을
            # 참조한다 — EKS 전체 destroy→apply 리허설 중 하드코딩 탓에 재연결이
            # 전부 실패했던 것을 보고 고침.
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: backend-cluster-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_IAM_AUTH
              value: "true"
            - name: REDIS_ADDR
              value: "master.team1-truss-redis.q2tpkl.apn2.cache.amazonaws.com:6379"
            - name: REDIS_TLS_ENABLED
              value: "true"
          ports:
            - name: metrics
              containerPort: 9090
          # 2026-08-19: 이번 세션 부하테스트로 미종결 주문이 15만 건 이상 쌓인 상태에서
          # 재시작하면서 그 백로그를 메모리에 복원하다 512Mi를 넘겨 OOMKilled(exit 137)됐다
          # (kubectl describe pod의 lastState.terminated.reason으로 확인) — 512Mi/1Gi로 상향.
          # 2026-08-19(두 번째): 1Gi로도 다시 OOMKilled — 부하테스트 백로그가 계속
          # 자라서(recorder_pending_orders 계속 증가 중) 재시작 때마다 복원해야 할 상태가
          # 더 커졌다. 2Gi로 재상향, 하지만 이건 백로그 크기에 맞춰 메모리를 계속 올리는
          # 임시방편이라 근본적으로는 테스트 백로그 정리가 필요.
          # 2026-08-20: request(1Gi)가 실사용량(100배속 부하테스트 중 kubectl describe로
          # 확인, 컨테이너가 1.72GB 사용 중이었음)보다 한참 낮아서, 스케줄러가 노드 하나에
          # request 기준으로 "더 들어간다"고 착각하고 과밀 배치했다 — 그 결과 컨테이너
          # 자체는 limit(2Gi) 안에 있는데도 노드 전체 메모리가 바닥나 kubelet이 파드를
          # 강제 축출(Evicted)하는 사고로 이어짐. 노드를 더 늘려도 새 노드에서 똑같은
          # 과밀 배치가 반복될 뿐이라 근본 해결이 아니고, request를 실사용치에 맞게
          # 올려야 스케줄러가 애초에 노드당 개수를 정확히 계산한다.
          #
          # 2026-08-21(새벽): 처리 대기 백로그가 142,000건까지 쌓인 상태에서 2Gi도
          # 초과해 다시 OOMKilled(재시작 13회) — matching-engine이 재시작할 때마다
          # DB의 미종결 주문을 전부 메모리로 복원하는 구조라, 이 시점의 백로그
          # 크기가 그대로 필요 메모리가 된다(2026-08-19 최초 발견 당시와 같은
          # 근본 원인, 그때도 512Mi->1Gi->2Gi로 이미 두 번 올렸었음). 4Gi로
          # 재상향하지만, 이건 "백로그 크기만큼 계속 한도를 올리는" 세 번째
          # 땜질이다 — 진짜 고치려면 (a) 재시작 시 전체 백로그를 한번에 복원하지
          # 않고 스트리밍/페이지네이션하거나, (b) 테스트 세션마다 오래된 미종결
          # 주문을 주기적으로 정리하는 구조가 필요함. 팀 논의 대상.
          #
          # 2026-08-21(새벽, 정정): 위에서 3Gi로 올렸더니 노드(c6i.large) allocatable이
          # 3217Mi(kubectl describe node로 확인)라 그 자체로 스케줄링이 아예 안 됐다
          # ("no instance type has enough resources") — request가 노드 하나의 전체
          # allocatable보다 커서 그 어떤 노드에도 못 올라감. 2Gi/2.8Gi로 낮춰서
          # 데몬셋 몫(CNI/kube-proxy 등)을 남기고 실제로 스케줄될 수 있게 함.
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2867Mi
          # readinessProbe 없이는 재시작 직후(Kafka 연결/상태 복원 전)에도 파드가 즉시
          # Ready로 잡혀 트래픽을 받을 수 있다 — orderapi에서 같은 이유로 502가 재현된 걸
          # 보고 다른 backend 서비스에도 같이 추가한다(2026-08-19). /metrics는 HTTP 서버가
          # 뜨는 즉시 응답하므로 준비 상태 판단에 충분하다.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  # 이름이 "matching-engine"이 아니라 "matching-engine-metrics"인 이유 — orderapi의
  # 헬스체크(systemstatus.go의 matchingEngineMetricsURL, "매칭 엔진" 상태)와 그라파나
  # 대시보드 스크레이프 설정이 이 정확한 이름을 기대한다. 원래 이 YAML엔 "matching-engine"
  # 으로 잘못 적혀 있었고, 실제 클러스터엔 이 이름의 서비스가 (아마 손으로) 따로
  # 만들어져 있었던 것으로 보인다 — EKS를 통째로 지웠다 올리는 리허설(2026-08-24) 중
  # 이 YAML만 적용해서는 "매칭 엔진" 상태가 계속 "down"으로 나오는 걸 보고 발견/수정.
  name: matching-engine-metrics
  namespace: backend
  labels:
    app: matching-engine
  annotations:
    # 이 annotation 3개가 없으면 monitoring-ec2/prometheus.yml.tpl의 k8s-services
    # job이 이 Service를 아예 발견하지 못한다(relabel_configs가 prometheus_io_scrape
    # annotation을 keep 조건으로 씀) — 위 name 수정과 같은 이유로 예전엔 손으로만
    # 붙어있었던 것으로 보인다. 이게 없어서 그라파나 "매칭 엔진 상태" 패널이
    # up{service="matching-engine-metrics"}에 데이터가 아예 없어 "장애"로 나오는 걸
    # 보고 발견(2026-08-25, EKS 전체 destroy→apply 리허설 후 그라파나에서 실측).
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
spec:
  selector:
    app: matching-engine
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
