# 매칭 엔진 — 앱 팀원이 올린 matching-latest 이미지. 환경변수는 앱 팀원이 전달한
# "AWS 리소스·권한·계정 정리" 문서 기준 — Kafka는 KAFKA_USE_IAM_AUTH=true 하나로 IAM
# 인증을 켜고(KAFKA_SECURITY_PROTOCOL/SASL_MECHANISM은 앱이 안 읽음), Redis는
# REDIS_TLS_ENABLED=true + REDIS_PASSWORD(AUTH 토큰, elasticache.tf)를 준다. replicas는
# KEDA ScaledObject(matching-engine-scaledobject.yaml)가 컨슈머 랙 기준으로 조절 —
# 여기 값은 minReplicaCount와 맞춰야 한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  namespace: backend
  labels:
    app: matching-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-engine
  template:
    metadata:
      labels:
        app: matching-engine
    spec:
      serviceAccountName: sa-matching-engine
      tolerations:
        - key: workload
          value: backend
          effect: NoSchedule
      nodeSelector:
        team1.io/workload: backend
      containers:
        - name: matching-engine
          image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team1-truss:matching-latest
          # 태그가 "latest"가 아니라 "matching-latest"라 K8s 기본 imagePullPolicy가
          # IfNotPresent — 캐시된 예전 이미지를 계속 쓰지 않도록 Always로 맞춘다.
          imagePullPolicy: Always
          env:
            # MSK 재생성 때마다 바뀌는 값이라 리터럴 대신 terraform이 관리하는
            # ConfigMap(infra/k8s-addons.tf의 backend-cluster-config)을 참조한다.
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: backend-cluster-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_IAM_AUTH
              value: "true"
            - name: REDIS_ADDR
              value: "master.team1-truss-redis.q2tpkl.apn2.cache.amazonaws.com:6379"
            - name: REDIS_TLS_ENABLED
              value: "true"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth-secret
                  key: REDIS_PASSWORD
          ports:
            - name: metrics
              containerPort: 9090
          # matching-engine은 재시작할 때마다 DB의 미종결 주문을 전부 메모리로 복원하는
          # 구조라, 그 시점의 백로그 크기가 그대로 필요 메모리가 된다 — 고배속 부하테스트
          # 백로그로 OOMKilled가 반복돼 한도를 올렸다. request(2Gi)는 실사용량에 최대한
          # 맞춰야 한다 — 너무 낮으면 스케줄러가 노드 하나에 과밀 배치해서, 컨테이너
          # 자체는 limit 안인데도 노드 전체 메모리가 바닥나 kubelet이 강제 축출한다.
          # limit(2867Mi)은 노드(c6i.large) allocatable(~3217Mi)에서 데몬셋 몫(CNI/
          # kube-proxy 등)을 남기고 실제로 스케줄될 수 있는 상한이다. 근본적으로는
          # (a) 재시작 시 백로그를 스트리밍/페이지네이션으로 복원하거나, (b) 오래된
          # 미종결 주문을 주기적으로 정리하는 구조가 필요함 — 팀 논의 대상.
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2867Mi
          # readinessProbe 없이는 재시작 직후(Kafka 연결/상태 복원 전)에도 파드가 즉시
          # Ready로 잡혀 트래픽을 받을 수 있다. /metrics는 HTTP 서버가 뜨는 즉시
          # 응답하므로 준비 상태 판단에 충분하다.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # orderapi-deployment.yaml과 같은 이유 — CSI secretObjects 동기화 트리거 전용,
          # 아무 경로도 이 마운트를 직접 읽지 않는다.
          volumeMounts:
            - name: secrets-store-redis-auth
              mountPath: /mnt/secrets-store-redis-auth
              readOnly: true
      volumes:
        - name: secrets-store-redis-auth
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: redis-auth-secret-provider
---
apiVersion: v1
kind: Service
metadata:
  # 이름이 "matching-engine"이 아니라 "matching-engine-metrics"인 이유 — orderapi의
  # 헬스체크(systemstatus.go의 matchingEngineMetricsURL, "매칭 엔진" 상태)와 그라파나
  # 대시보드 스크레이프 설정이 이 정확한 이름을 기대한다.
  name: matching-engine-metrics
  namespace: backend
  labels:
    app: matching-engine
  annotations:
    # 이 annotation 3개가 없으면 monitoring-ec2/prometheus.yml.tpl의 k8s-services
    # job이 이 Service를 아예 발견하지 못한다(relabel_configs가 prometheus_io_scrape
    # annotation을 keep 조건으로 씀).
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
spec:
  selector:
    app: matching-engine
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
