# matching-engine을 컨슈머 랙(matching_engine_lag, matching-engine이 스스로 노출하는
# Prometheus 게이지 — 담당 파티션들의 합계)으로 스케일한다. CPU 대신 이걸 쓰는 이유:
# 부하가 CPU가 아니라 처리 속도 자체에 걸리는 경우(Kafka I/O 대기 등) CPU는 멀쩡한데
# 주문만 밀릴 수 있어서 — 실제로 밀려 있는 양을 직접 봐야 한다. sum()으로 전체 인스턴스의
# 랙을 더한 값을 기준으로 삼는다 — 인스턴스가 늘어날수록 FR-11 재분배로 담당 파티션이
# 쪼개지면서 인스턴스당 랙은 자연히 줄어드는데, 합계는 "아직 못 따라잡은 전체 양"을
# 그대로 반영한다. threshold=500은 실측 전 잠정값.
#
# 전제: KEDA가 클러스터에 설치돼 있어야 한다(Terraform 관리 밖, helm_release로 karpenter.tf/
# k8s-addons.tf와 같은 패턴).
#
# minReplicaCount=2 — 1개면 버스트 유입 시 그 1개 파드가 20개 마켓 물량을 스케일업(15~90초)
# 될 때까지 혼자 받다가 OOMKilled되고, 크래시마다 Kafka 컨슈머 그룹 리밸런스로 다른
# 파드들의 체결 발행까지 잠깐 실패해 랙/백프레셔로 번진다 — "혼자 다 받는 상황" 자체를
# 없앤다. (KEDA는 minReplicaCount>0일 땐 cooldownPeriod를 아예 무시하고, 축소 속도는
# K8s HPA 기본 스케일다운 stabilization window가 결정한다 — 아래 60초.)
#
# matching_engine_lag은 "아직 못 읽은 메시지 수"만 재서, 다 읽었지만 체결 상대가 없어
# 호가창(orderbook.elements)에 무기한 쌓이는 미체결 주문은 못 본다 — 랙과 무관하게
# 메모리만 계속 자라다가 limit에서 바로 OOMKilled될 수 있다. matching_engine_book_size
# (담당 마켓 전체 호가창 미체결 주문 수 합계)를 두 번째 트리거로 추가한다 — KEDA는
# 여러 트리거 중 "가장 많은 레플리카를 요구하는 값"을 따르므로(OR 조건) 둘 중 하나만
# 넘어도 스케일아웃된다. threshold=20000도 lag와 같은 이유로 실측 전 잠정값 — 인스턴스당
# 2Gi/2867Mi(matching-engine-deployment.yaml) 한도 안에서 안전한 상한은 아직 미측정.
#
# stabilizationWindowSeconds=60 — minReplicaCount=2 바닥이 "혼자 다 받다가 OOMKilled"
# 재발을 이미 막아주므로, K8s HPA 기본값(300초)만큼 안전 마진을 둘 필요가 줄었다고 판단.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: matching-engine
  namespace: backend
spec:
  scaleTargetRef:
    name: matching-engine
  minReplicaCount: 2
  maxReplicaCount: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitor.jhyang.click:9090
        metricName: matching_engine_total_lag
        query: sum(matching_engine_lag)
        threshold: "500"
    - type: prometheus
      metadata:
        serverAddress: http://monitor.jhyang.click:9090
        metricName: matching_engine_total_book_size
        query: sum(matching_engine_book_size)
        threshold: "20000"
