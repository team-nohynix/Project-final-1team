# matching-engine을 컨슈머 랙(matching_engine_lag, matching-engine이 스스로 노출하는
# Prometheus 게이지 — 담당 파티션들의 합계, 백프레셔 플래그와 같은 값)으로 스케일한다.
# CPU 대신 이걸 쓰는 이유: 부하가 CPU가 아니라 처리 속도 자체에 걸리는 경우(예: Kafka
# I/O 대기) CPU는 멀쩡한데 주문만 밀릴 수 있어서 — 실제로 밀려 있는 양을 직접 봐야
# 한다(2026-08-12 결정). sum()으로 전체 인스턴스의 랙을 더한 값을 기준으로 삼는다 —
# 인스턴스가 늘어날수록 FR-11 재분배로 담당 파티션이 쪼개지면서 인스턴스당 랙은
# 자연히 줄어드는데, 합계는 "아직 못 따라잡은 전체 양"을 그대로 반영한다.
#
# threshold=500은 잠정값 — 이 프로젝트의 다른 워터마크들(matching/backpressure의
# 5000/1000 등)과 마찬가지로 실측 부하 시험 전까지는 근거 없는 시작값이다.
#
# 전제: KEDA가 클러스터에 설치돼 있어야 한다(Terraform 관리 밖, 다른 Helm 설치들과
# 같은 방식) — helm repo add kedacore https://kedacore.github.io/charts &&
# helm install keda kedacore/keda --namespace keda --create-namespace
#
# matching_engine_lag 자체는 matching/metrics.go가 새로 노출하는 값이라, 이 파일을
# 적용해도 아직 예전 이미지가 떠 있는 동안은 값이 0으로 보인다(HPA가 지표 자체는
# 정상적으로 읽지만 데이터가 없을 뿐) — matching-latest 이미지가 metrics.go 포함해서
# 재빌드/재배포된 뒤에야 실제로 스케일링이 동작한다.
#
# 2026-08-20: serverAddress가 예전 in-cluster kube-prometheus-stack을 가리키고
# 있었는데, 그 Prometheus를 자체 호스팅 EC2로 완전히 이전(monitoring-ec2.tf)하면서
# 지워버려서 KEDA가 DNS lookup부터 계속 실패하고 있었다(kubectl describe
# scaledobject로 확인: "dial tcp: lookup ...monitoring.svc.cluster.local ...
# no such host") — READY=False로 오토스케일링 자체가 죽어있던 진짜 원인. 새
# Prometheus(EC2, EIP+도메인)를 가리키도록 고침.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: matching-engine
  namespace: backend
spec:
  scaleTargetRef:
    name: matching-engine
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitor.jhyang.click:9090
        metricName: matching_engine_total_lag
        query: sum(matching_engine_lag)
        threshold: "500"
