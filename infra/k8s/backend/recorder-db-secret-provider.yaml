# SecretProviderClass — secrets-manager.tf의 team1/backend/mysql-db-url을 읽어와
# recorder-db-secret이라는 이름의 K8s Secret으로 동기화한다(secretObjects 블록).
# recorder-deployment.yaml의 DATABASE_URL은 여전히 이 Secret을 secretKeyRef로 참조하므로
# 바뀌지 않는다 — Secret의 "생성자"만 손으로 만든 값에서 이 CSI 동기화로 바뀌는 것.
#
# secretObjects 기반 동기화는 최소 한 개의 파드가 이 SecretProviderClass를 볼륨으로
# 마운트해야 트리거된다(csi-secrets-store.tf 참고) — recorder-deployment.yaml의
# secrets-store-inline 볼륨이 그 역할.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: recorder-db-secret-provider
  namespace: backend
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "team1/backend/mysql-db-url"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DATABASE_URL"
            objectAlias: "DATABASE_URL"
  secretObjects:
    - secretName: recorder-db-secret
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
