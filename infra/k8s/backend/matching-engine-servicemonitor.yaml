# kube-prometheus-stack의 Prometheus가 release=prometheus 라벨 달린 ServiceMonitor만
# 골라서 스크랩하도록 설정돼 있다(Prometheus CR의 serviceMonitorSelector, 실측 확인함) —
# 이 라벨이 없으면 조용히 무시된다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: matching-engine
  namespace: backend
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: matching-engine
  namespaceSelector:
    matchNames:
      - backend
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
