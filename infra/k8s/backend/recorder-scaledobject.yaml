# recorder를 컨슈머 랙(recorder_consumer_lag, recorder/metrics.go가 노출 —
# orders/executions 리더 각각)으로 스케일한다 — matching-engine과 같은 이유.
#
# matching-engine과 달리 recorder는 FR-11 같은 파티션-마켓 고정 배정이 없는 표준
# Kafka 컨슈머 그룹(recorder-orders/recorder-executions/recorder-assignments,
# recorder/main.go)이라 레플리카를 늘리면 Kafka가 파티션을 알아서 재분배한다 —
# orders/executions/assignments 토픽 전부 20개 파티션이라 5개 레플리카까지는
# 여유 있게 병렬화된다.
#
# threshold=1000은 recorder 자신의 백프레셔 상위 워터마크(backpressureHighWatermark
# = 2000, recorder/main.go)의 절반 — 백프레셔가 실제로 걸려서 orderapi가 429를
# 뱉기 전에 먼저 스케일 아웃을 시도해보려는 것. 실측 부하 시험 전까지는 잠정값이다.
#
# minReplicaCount=2, stabilizationWindowSeconds=60 — matching-engine-scaledobject.yaml과
# 같은 이유(바닥이 1이면 스케일 전환 중 순간적으로 0개 파드 구간이 생겨 502로 이어진다).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: recorder
  namespace: backend
spec:
  scaleTargetRef:
    name: recorder
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitor.jhyang.click:9090
        metricName: recorder_total_lag
        query: sum(recorder_consumer_lag)
        threshold: "1000"
