# orderapi/matching-engine/recorder는 레플리카 1개가 기본(matching-engine/recorder는
# KEDA가 자동 스케일하지만 평시엔 바닥값 1)이라, PDB 없이는 Karpenter의 노드 통합
# (consolidation)이 그 하나뿐인 파드를 제약 없이 evict할 수 있다 — 재스케줄되는
# 동안 ALB에 건강한 타겟이 0개가 되어 요청이 실패한다. minAvailable: 1은 레플리카가
# 1개일 때 그 유일한 파드를 자발적 축출(Karpenter consolidation, kubectl drain 등)
# 대상에서 제외시킨다 — 노드 하드웨어 장애 같은 불가피한 경우는 막지 못한다(PDB는
# voluntary disruption에만 적용).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orderapi
  namespace: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: orderapi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: matching-engine
  namespace: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: matching-engine
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: recorder
  namespace: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: recorder
