# SecretProviderClass — secrets-manager.tf의 team1/backend/redis-auth-token을 읽어와
# redis-auth-secret이라는 이름의 K8s Secret으로 동기화한다(secretObjects 블록).
# recorder-db-secret-provider.yaml과 같은 패턴이지만 별도 파일로 둔다 — DB URL은
# recorder 전용이고 이 토큰은 orderapi/matching-engine/recorder 셋 다 필요해서, 하나를
# 마운트하는 파드가 늘어나도 서로 다른 시크릿의 수명주기가 섞이지 않게 분리한다.
#
# secretObjects 기반 동기화는 최소 한 개의 파드가 이 SecretProviderClass를 볼륨으로
# 마운트해야 트리거된다(csi-secrets-store.tf 참고) — orderapi/matching-engine/recorder
# 세 Deployment 모두 각자의 secrets-store-redis-auth 볼륨으로 이걸 마운트한다.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: redis-auth-secret-provider
  namespace: backend
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "team1/backend/redis-auth-token"
        objectType: "secretsmanager"
        jmesPath:
          - path: "REDIS_PASSWORD"
            objectAlias: "REDIS_PASSWORD"
  secretObjects:
    - secretName: redis-auth-secret
      type: Opaque
      data:
        - objectName: REDIS_PASSWORD
          key: REDIS_PASSWORD
