# 접수 API(orderapi) — 앱 담당자가 전달한 deployment-env-vars.md 문서 2번 표 기준.
# JOB_TRIGGER_QUEUE_URL을 채워야 POST /v1/jobs 라우트가 등록된다(비우면 main.go가 라우트
# 자체를 안 만듦).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderapi
  namespace: backend
  labels:
    app: orderapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderapi
  template:
    metadata:
      labels:
        app: orderapi
    spec:
      serviceAccountName: sa-ingest-api
      tolerations:
        - key: workload
          value: backend
          effect: NoSchedule
      nodeSelector:
        team1.io/workload: backend
      containers:
        - name: orderapi
          image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team1-truss:orderapi-latest
          # 태그가 "orderapi-latest"라 K8s 기본 imagePullPolicy가 IfNotPresent —
          # 캐시된 예전 이미지를 계속 쓰지 않도록 Always로 맞춘다.
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            # MSK 재생성 때마다 바뀌는 값이라 리터럴 대신 terraform이 관리하는
            # ConfigMap(infra/k8s-addons.tf의 backend-cluster-config)을 참조한다.
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: backend-cluster-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_IAM_AUTH
              value: "true"
            - name: REDIS_ADDR
              value: "master.team1-truss-redis.q2tpkl.apn2.cache.amazonaws.com:6379"
            - name: REDIS_TLS_ENABLED
              value: "true"
            # ElastiCache AUTH 토큰(elasticache.tf) — orderapi/config.go가 이미 선택
            # 환경변수로 읽던 값이라 여기 채우는 것만으로 인증이 켜진다. Secrets Store
            # CSI Driver가 아래 volumeMounts로 redis-auth-secret K8s Secret을 만들어준다.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth-secret
                  key: REDIS_PASSWORD
            - name: JOB_TRIGGER_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/727646470302/team1-sqs-job-trigger"
            # startJobHandler의 orderBucket 기본값, replay-preview의 S3 조회가 이 값에
            # 의존한다 — 비우면 둘 다 로컬 폴백으로 조용히 실패한다.
            - name: ORDER_RECORDS_BUCKET
              value: "team1-truss-order-records"
            # orderapi/sessioncleanup.go(세션 종료 시 미종결 주문 자동 취소)가
            # RECORDER_URL이 없으면 조용히 스킵한다 — recorder Service(같은 backend
            # 네임스페이스, 8082)를 가리키게 채운다.
            - name: RECORDER_URL
              value: "http://recorder:8082"
            # GET /v1/metrics/cluster(clustermetrics.go)가 그라파나 team1-overview
            # 대시보드와 같은 PromQL을 재사용하려고 모니터링 EC2의 Prometheus를 직접
            # 찌른다(infra/monitoring-ec2.tf, team1_sg_monitoring이 9090을 0.0.0.0/0로
            # 열어둬서 같은 VPC에서 별도 SG 규칙 없이 도달 가능).
            - name: PROMETHEUS_URL
              value: "http://monitor.jhyang.click:9090"
          # order.Store(취소 처리용)와 idempotency.Store가 세션이 끝날 때까지 접수된
          # 주문을 전부 메모리에 들고 있는 구조라, 고배속 부하테스트에서 주문이 수만
          # 건 누적되면 그 자체로 메모리를 다 쓴다 — 근본적으로는 두 저장소가 무한정
          # 커지는 게 원인이고(처리 완료된 주문을 주기적으로 비우는 구조 개선이 필요),
          # 지금은 한도를 넉넉히 잡아 대응한다.
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
          # readinessProbe가 없으면 Kafka/Redis 연결을 맺기 전(main.go의
          # http.ListenAndServe 이전 단계)에도 파드가 즉시 Ready로 잡혀서, ALB가 그
          # 틈에 트래픽을 보내면 502가 난다 — ingress의 healthcheck-path와 같은
          # 엔드포인트를 재사용한다. timeoutSeconds를 명시 안 하면 K8s 기본값 1초가
          # 적용되는데, 이 엔드포인트는 Redis 왕복을 포함해서 부하테스트 중 순간적으로
          # 1초를 넘기면 파드는 멀쩡한데도 ALB에서 빠져 503이 날 수 있어 늘린다.
          # livenessProbe도 같은 이유로 같이 늘림.
          readinessProbe:
            httpGet:
              path: /v1/markets/KRW-BTC/orderbook
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/markets/KRW-BTC/orderbook
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # readinessProbe는 "새 파드가 준비되기 전에 트래픽을 받는" 쪽은 막아주지만,
          # "오래된 파드가 종료되기 시작한 뒤에도 ALB가 잠깐 더 트래픽을 보내는" 반대쪽
          # 틈은 못 막는다 — SIGTERM을 받자마자 바로 죽지 않고 몇 초 버텨서, 그 사이
          # ALB가 타겟 그룹에서 이 파드를 실제로 빼도록 시간을 준다.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 8"]
          # 아무 경로도 이 마운트를 직접 읽지 않는다 — REDIS_PASSWORD는 위 secretKeyRef로
          # 받는다. CSI secretObjects 동기화를 "트리거"하는 용도일 뿐이다.
          volumeMounts:
            - name: secrets-store-redis-auth
              mountPath: /mnt/secrets-store-redis-auth
              readOnly: true
      volumes:
        - name: secrets-store-redis-auth
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: redis-auth-secret-provider
---
apiVersion: v1
kind: Service
metadata:
  name: orderapi
  namespace: backend
spec:
  selector:
    app: orderapi
  ports:
    - port: 8081
      targetPort: 8081
---
# 그라파나 대시보드가 up{service="orderapi-metrics"}로 스크레이프 성공 여부를 묻는데
# (matching-engine-metrics와 같은 이유), Ingress가 참조하는 위 "orderapi" Service의
# 이름은 그대로 둔 채(건드리면 Ingress 백엔드까지 같이 손봐야 해서) 스크레이프
# 전용으로 별도 Service를 둔다. 같은 포트/셀렉터라 트래픽 경로는 안 늘어난다.
apiVersion: v1
kind: Service
metadata:
  name: orderapi-metrics
  namespace: backend
  labels:
    app: orderapi
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: /metrics
spec:
  selector:
    app: orderapi
  ports:
    - name: metrics
      port: 8081
      targetPort: 8081
