# 기록기 — recorder-latest. 환경변수는 앱 담당자가 전달한 "AWS 리소스·권한·계정 정리"
# 문서 기준 — Kafka는 KAFKA_USE_IAM_AUTH=true, Redis는 REDIS_TLS_ENABLED + REDIS_PASSWORD
# (AUTH 토큰), DATABASE_URL은 go-sql-driver/mysql DSN(user:pass@tcp(host:port)/db).
# 스키마는 자동 마이그레이션이 없어 recorder/schema.sql을 수동 적용해야 한다(적용 완료).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recorder
  namespace: backend
  labels:
    app: recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recorder
  template:
    metadata:
      labels:
        app: recorder
    spec:
      serviceAccountName: sa-recorder
      # team1-backend NodePool(c6i.large 고정)은 매칭엔진 성능 측정 대상이라 인스턴스
      # 타입을 못 바꾼다(nodepool-backend.yaml 참고) — recorder는 measured 대상이
      # 아니고, 고배속 세션 종료 시점에 몰아치는 체결 배치를 버티려면 c6i.large 한 대
      # (allocatable ~3.1Gi)로는 recorder 혼자 거의 다 써버린다. team1-recorder라는
      # 별도 NodePool(c6i.xlarge, ~7.6Gi)로 분리해 매칭엔진/접수API가 도는 노드 풀에는
      # 전혀 영향 없이 여유를 확보한다.
      tolerations:
        - key: workload
          value: recorder
          effect: NoSchedule
      nodeSelector:
        team1.io/workload: recorder
      containers:
        - name: recorder
          image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team1-truss:recorder-latest
          # 태그가 "recorder-latest"라 K8s 기본 imagePullPolicy가 IfNotPresent —
          # 캐시된 예전 이미지를 계속 쓰지 않도록 Always로 맞춘다.
          imagePullPolicy: Always
          env:
            # MSK 재생성 때마다 바뀌는 값이라 리터럴 대신 terraform이 관리하는
            # ConfigMap(infra/k8s-addons.tf의 backend-cluster-config)을 참조한다.
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: backend-cluster-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_IAM_AUTH
              value: "true"
            - name: REDIS_ADDR
              value: "master.team1-truss-redis.q2tpkl.apn2.cache.amazonaws.com:6379"
            - name: REDIS_TLS_ENABLED
              value: "true"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth-secret
                  key: REDIS_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: recorder-db-secret
                  key: DATABASE_URL
            # 실제 코드(recorder/config.go)가 읽는 이름은 ARCHIVE_BUCKET이다.
            - name: ARCHIVE_BUCKET
              value: "team1-truss-trade-results"
          # recorder는 고배속 세션 종료 시점에 한꺼번에 몰린 체결 배치를 처리하다
          # OOMKilled되기 쉽다 — team1-recorder NodePool(c6i.xlarge, ~7.6Gi)로 옮기면서
          # 더 빠른 배속의 종료 버스트도 여유 있게 버티도록 5Gi로 잡는다.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 5Gi
          # readinessProbe 없이 재시작 직후 트래픽을 받으면 502가 난다(orderapi와 같은
          # 이유). recorder는 DB 접속 실패 시 크래시루프에 빠질 수 있어서, /metrics
          # (HTTP 서버만 뜨면 응답, DB 의존 없음)로 최소한의 "프로세스가 살아있음"만
          # 확인한다.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # orderapi와 같은 이유 — ALB가 종료 중인 파드를 타겟 그룹에서 빼는 데 걸리는
          # 시간만큼 SIGTERM 처리를 늦춘다.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 8"]
          # 아무 경로도 이 마운트를 직접 읽지 않는다 — DATABASE_URL/REDIS_PASSWORD는
          # secretKeyRef로 받는다. CSI secretObjects 동기화를 "트리거"하는 용도일 뿐이다
          # (최소 한 파드가 마운트해야 동기화가 시작됨). 두 시크릿을 별도 CSI 볼륨으로
          # 뗀 이유는 redis-auth-secret-provider.yaml이 orderapi/matching-engine도 함께
          # 마운트하는 공용 SecretProviderClass라 수명주기를 안 섞기 위함.
          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: secrets-store-redis-auth
              mountPath: /mnt/secrets-store-redis-auth
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: recorder-db-secret-provider
        - name: secrets-store-redis-auth
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: redis-auth-secret-provider
---
# 조회 API(GET /v1/trace/{orderId}, GET /v1/matching/engines, :8082 고정) 노출용.
# orderapi Ingress와 ALB를 공유하므로 Ingress 전체 헬스체크 경로(/v1/markets/KRW-BTC/
# orderbook, orderapi 전용)가 그대로 적용되면 recorder 타겟그룹이 항상 unhealthy가
# 된다 — Service 자체에 오버라이드를 걸어 AWS Load Balancer Controller가 이
# 백엔드에는 이 경로로 헬스체크하게 한다.
apiVersion: v1
kind: Service
metadata:
  name: recorder
  namespace: backend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /v1/matching/engines
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  selector:
    app: recorder
  ports:
    - port: 8082
      targetPort: 8082
---
# orderapi-metrics와 같은 이유 — 그라파나가 up{service="recorder-metrics"}로 물어서
# 스크레이프 전용 Service를 따로 둔다. 위 "recorder" Service(ALB 헬스체크 경로
# 오버라이드가 걸려있음)는 그대로 둔다.
apiVersion: v1
kind: Service
metadata:
  name: recorder-metrics
  namespace: backend
  labels:
    app: recorder
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: /metrics
spec:
  selector:
    app: recorder
  ports:
    - name: metrics
      port: 8082
      targetPort: 8082
