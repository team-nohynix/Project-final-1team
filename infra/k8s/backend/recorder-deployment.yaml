# 기록기 — recorder-latest. 환경변수는 앱 담당자가 전달한 "AWS 리소스·권한·계정 정리"
# 문서(2026-08-11) 기준 — Kafka는 KAFKA_USE_IAM_AUTH=true 하나, Redis는 REDIS_TLS_ENABLED만
# (AUTH 토큰 없음), DATABASE_URL은 go-sql-driver/mysql DSN(user:pass@tcp(host:port)/db).
# 스키마는 자동 마이그레이션이 없어 recorder/schema.sql을 수동 적용해야 한다(적용 완료).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recorder
  namespace: backend
  labels:
    app: recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recorder
  template:
    metadata:
      labels:
        app: recorder
    spec:
      serviceAccountName: sa-recorder
      # 2026-08-25: team1-backend NodePool(c6i.large 고정)은 매칭엔진 성능 측정
      # 대상이라 인스턴스 타입을 못 바꾼다(nodepool-backend.yaml 주석 참고) —
      # recorder는 measured 대상이 아니고, 60/80배속 종료 시점 몰아치는 배치를
      # 버티려면 c6i.large 한 대(allocatable ~3.1Gi)로는 recorder 혼자 거의 다
      # 써버린다. team1-recorder라는 별도 NodePool(c6i.xlarge, ~7.6Gi)로 분리해
      # 매칭엔진/접수API가 도는 노드 풀에는 전혀 영향 없이 여유를 확보한다.
      tolerations:
        - key: workload
          value: recorder
          effect: NoSchedule
      nodeSelector:
        team1.io/workload: recorder
      containers:
        - name: recorder
          image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team1-truss:recorder-latest
          # 태그가 "recorder-latest"라 K8s 기본 imagePullPolicy가 IfNotPresent —
          # matching-engine에서 재배포해도 캐시된 예전 이미지를 쓰는 걸 실측으로
          # 발견해서 여기도 같이 맞춘다.
          imagePullPolicy: Always
          env:
            # 2026-08-24: MSK 재생성 때마다 바뀌는 값이라 리터럴 대신 terraform이
            # 관리하는 ConfigMap(infra/k8s-addons.tf의 backend-cluster-config)을
            # 참조한다 — EKS 전체 destroy→apply 리허설 중 하드코딩 탓에 재연결이
            # 전부 실패했던 것을 보고 고침.
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: backend-cluster-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_IAM_AUTH
              value: "true"
            - name: REDIS_ADDR
              value: "master.team1-truss-redis.q2tpkl.apn2.cache.amazonaws.com:6379"
            - name: REDIS_TLS_ENABLED
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: recorder-db-secret
                  key: DATABASE_URL
            # 실제 코드(recorder/config.go)가 읽는 이름은 ARCHIVE_BUCKET이다 —
            # S3_TRADE_RESULTS_BUCKET은 존재하지 않는 변수라 recorder가 계속 빈 값으로
            # 인식해 로컬 ./records로 폴백했고, 컨테이너 안에서 mkdir 권한이 없어
            # "아카이브 저장 실패" 로그만 남기고 있었다(2026-08-12 실사용 중 발견).
            # RDS 저장 경로는 이 버그와 무관 — 원본 아카이빙(S3)만 계속 실패해온 것.
            - name: ARCHIVE_BUCKET
              value: "team1-truss-trade-results"
          # 2026-08-25 실측: 60배속 데모 세션이 끝나는 순간(매칭엔진이 부하 내내
          # 10/10 최대치였음) recorder가 한꺼번에 몰린 체결 배치를 처리하다
          # 512Mi에서 OOMKilled, 1Gi로 올려도 재발, 2.5Gi로 겨우 안정화됐다 —
          # 그마저도 c6i.large 노드 allocatable(~3.1Gi)을 recorder 혼자 거의
          # 다 쓰는 빠듯한 상태였다. team1-recorder NodePool(c6i.xlarge,
          # ~7.6Gi)로 옮기면서 80배속처럼 더 빠른 속도의 종료 버스트도 여유
          # 있게 버티도록 5Gi로 올린다.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 5Gi
          # orderapi에서 재현된 것과 같은 이유(readinessProbe 없이 재시작 직후 트래픽을
          # 받아 502)로 추가(2026-08-19). recorder는 RDS 접속 실패 시 크래시루프에 빠지는
          # 걸 이미 겪어서(DB 비밀번호 로테이션 사건), /metrics(HTTP 서버만 뜨면 응답,
          # DB 의존 없음)로 최소한의 "프로세스가 살아있음"만 확인한다.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # orderapi와 같은 이유(2026-08-20) — ALB가 종료 중인 파드를 타겟 그룹에서 빼는
          # 데 걸리는 시간만큼 SIGTERM 처리를 늦춘다.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 8"]
---
# 조회 API(GET /v1/trace/{orderId}, GET /v1/matching/engines, :8082 고정) 노출용.
# 2026-08-12까지 Service가 아예 없어서 클러스터 내부에서도 호출할 방법이 없었음
# (docs/frontend-backend-integration.md는 "연결 가능"이라 썼지만 실제로는 안 됐던 부분).
# orderapi Ingress와 ALB를 공유하므로 Ingress 전체 헬스체크 경로
# (/v1/markets/KRW-BTC/orderbook, orderapi 전용)가 그대로 적용되면 recorder
# 타겟그룹이 항상 unhealthy가 된다 — Service 자체에 오버라이드를 걸어
# AWS Load Balancer Controller가 이 백엔드에는 이 경로로 헬스체크하게 한다.
apiVersion: v1
kind: Service
metadata:
  name: recorder
  namespace: backend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /v1/matching/engines
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  selector:
    app: recorder
  ports:
    - port: 8082
      targetPort: 8082
---
# orderapi-metrics와 같은 이유(위 주석 참고) — 그라파나가 up{service="recorder-metrics"}로
# 물어서 스크레이프 전용 Service를 따로 둔다. 위 "recorder" Service(ALB 헬스체크 경로
# 오버라이드가 걸려있음)는 그대로 둔다.
apiVersion: v1
kind: Service
metadata:
  name: recorder-metrics
  namespace: backend
  labels:
    app: recorder
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: /metrics
spec:
  selector:
    app: recorder
  ports:
    - name: metrics
      port: 8082
      targetPort: 8082
