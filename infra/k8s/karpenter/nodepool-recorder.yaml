# recorder 전용 NodePool — 부하가 몰릴 때 recorder의 메모리 요구량이 team1-backend
# NodePool의 인스턴스 타입(c6i.large, allocatable ~3.1Gi) 대부분을 혼자 차지한다.
# team1-backend는 매칭엔진 성능 측정 대상이라 인스턴스 타입을 고정해야 하므로
# (nodepool-backend.yaml 참고) 거기에 손대는 대신, recorder만 별도 NodePool로
# 분리해 더 큰 인스턴스에서 여유 있게 돌린다 — 매칭엔진/접수API가 스케줄되는
# 노드 풀에는 전혀 영향 없음. EC2NodeClass(subnet/SG/instanceProfile)는
# nodepool-backend.yaml의 team1-backend를 그대로 재사용한다.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: team1-recorder
spec:
  template:
    metadata:
      labels:
        team1.io/workload: recorder
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: team1-backend
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["c6i.xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      taints:
        - key: workload
          value: recorder
          effect: NoSchedule
  limits:
    cpu: "8" # c6i.xlarge(4vCPU) 최대 2대 상당 — recorder는 replicas 1~10(KEDA)이지만
             # 실제로 한 번에 여러 대가 뜨는 워크로드가 아니라 여유만 확보하는 목적
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    # nodepool-backend.yaml과 동일 이유.
    consolidateAfter: 2m
