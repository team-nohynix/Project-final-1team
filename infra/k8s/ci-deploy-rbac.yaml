# cicd.tf의 aws_eks_access_entry.github_actions가 GitHub Actions 역할을
# kubernetes_groups=["team1-github-actions-deploy"]로 매핑해뒀다. 여기서 그
# 그룹에 실제 권한을 준다.
#
# CI가 매 배포마다 Deployment/Service 매니페스트를 직접 kubectl apply하므로 create/
# update 권한을 준다 — Ingress/RBAC/Secret 같은 더 민감한 리소스는 이 그룹에 안 주고
# 사람이 직접 적용한다(WAF ACL·인증서 연결 등 훨씬 드물게, 신중하게 바뀌어야 하는
# 리소스라 자동화 범위 밖에 남겨둠).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deploy
  namespace: backend
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-can-restart-deployments
  namespace: backend
subjects:
  - kind: Group
    name: team1-github-actions-deploy
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ci-deploy
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deploy
  namespace: collector
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-can-restart-deployments
  namespace: collector
subjects:
  - kind: Group
    name: team1-github-actions-deploy
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ci-deploy
  apiGroup: rbac.authorization.k8s.io
