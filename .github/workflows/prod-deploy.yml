name: Prod Deploy

# prod 브랜치에 push되면: 바뀐 경로만 골라(dorny/paths-filter) 프론트는 S3+CloudFront,
# 6개 Go 모듈은 이미지 빌드해서 ECR push(+Deployment 4개는 즉시 rollout restart),
# infra/는 terraform plan을 자동으로 돌리고 apply는 GitHub Environment(infra-apply)
# 승인이 있어야 실행된다 — 이 저장소는 여러 팀이 공유하는 AWS 계정을 쓰므로 실제
# 인프라를 바꾸는 apply만큼은 사람이 봐야 한다는 팀 결정. Environment에 필수
# 리뷰어를 설정하는 건 저장소 Settings에서 별도로 해야 한다(README/커밋 메시지 참고).

on:
  push:
    branches: [prod]
  # 수동 "전체 복구" 트리거(2026-08-24 추가) — 비용 절감을 위해 EKS 클러스터를
  # 통째로 지웠다가 다음 날 다시 올릴 때 씀. 평소 push 트리거는 detect-changes가
  # git diff만 보고 "바뀐 것만" 배포하는데, 클러스터를 새로 만든 직후엔 diff가
  # 없어도(그날 코드를 안 건드렸어도) 전부 다시 배포해야 한다. 이 트리거는
  # detect-changes의 모든 출력을 강제로 true로 만들고(아래 참고), terraform-apply
  # 뒤에 bootstrap-k8s job(네임스페이스/RBAC/인그레스/ScaledObject/Kafka 토픽처럼
  # 평소엔 사람이 손으로 apply하던 나머지 매니페스트 전부)까지 돌린다 — 이
  # job은 이 트리거에서만 돈다, 평소 push엔 안 낀다(ci-deploy-rbac.yaml 주석의
  # "Ingress/RBAC/Secret은 사람이 직접 적용한다" 원칙을 일상적인 배포에서는
  # 그대로 지키고, 이 트리거는 광범위한 권한을 가진 TF_APPLY_ROLE로 사람이
  # 명시적으로 누를 때만 돈다).
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: team1-truss
  EKS_CLUSTER: team1-eks
  ECR_PUSH_ROLE: arn:aws:iam::727646470302:role/team1-github-actions-ecr-push
  TF_PLAN_ROLE: arn:aws:iam::727646470302:role/team1-github-actions-tf-plan
  TF_APPLY_ROLE: arn:aws:iam::727646470302:role/team1-github-actions-tf-apply

jobs:
  # --- 임시 디버그(2차): 트러스트 정책의 sub 조건을 저장소 ID까지 정확히
  # 맞춰서 고쳤는데도 여전히 AssumeRoleWithWebIdentity가 실패해서, 이번에
  # 실패하는 바로 그 실행의 실제 sub 클레임을 다시 확인한다. 원인 파악되면
  # 이 job은 지운다.
  debug-oidc-token:
    runs-on: ubuntu-latest
    steps:
      - name: OIDC 토큰 클레임 디코딩 (sts.amazonaws.com 대상)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payloadB64 = token.split('.')[1];
            const payload = JSON.parse(Buffer.from(payloadB64, 'base64').toString('utf8'));
            delete payload.jti; // 토큰 재현에 쓰일 수 있는 값이라 제외, 나머지는 민감정보 아님
            console.log('=== GitHub OIDC 토큰 클레임 (audience=sts.amazonaws.com) ===');
            console.log(JSON.stringify(payload, null, 2));
      - name: 실제 배포 job과 동일한 방식(aws-actions/configure-aws-credentials)으로 assume 시도
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::727646470302:role/team1-github-actions-ecr-push
          aws-region: ap-northeast-2
      - name: assume 성공 시 현재 identity 출력
        run: aws sts get-caller-identity

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # workflow_dispatch("전체 복구")면 paths-filter(steps.filter, push 이벤트
      # 전용 — github.event.before가 workflow_dispatch엔 없어서 그대로 두면
      # 에러남)를 아예 안 돌리고 steps.force가 전부 true를 준다.
      frontend: ${{ steps.filter.outputs.frontend || steps.force.outputs.all }}
      backend: ${{ steps.filter.outputs.backend || steps.force.outputs.all }}
      orderapi: ${{ steps.filter.outputs.orderapi || steps.force.outputs.all }}
      matching: ${{ steps.filter.outputs.matching || steps.force.outputs.all }}
      recorder: ${{ steps.filter.outputs.recorder || steps.force.outputs.all }}
      trader: ${{ steps.filter.outputs.trader || steps.force.outputs.all }}
      replayengine: ${{ steps.filter.outputs.replayengine || steps.force.outputs.all }}
      infra: ${{ steps.filter.outputs.infra || steps.force.outputs.all }}
    steps:
      - uses: actions/checkout@v4
      - name: workflow_dispatch("전체 복구")면 모두 강제로 true
        if: github.event_name == 'workflow_dispatch'
        id: force
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          # base 미지정 시 dorny/paths-filter가 (push 이벤트의 직전 커밋이 아니라)
          # main과 prod의 merge-base를 기준으로 diff를 계산한다 — 이 저장소의 main은
          # 한참 방치돼 있어서(2026-08-20 기준 merge-base가 그날 작업 시작 전 커밋),
          # 그날 하루 동안 recorder/orderapi/matching 등을 한 번이라도 건드렸으면
          # 그 뒤로는 그 파일들과 전혀 무관한 push(예: 대시보드 JSON만 수정)에도
          # 계속 "바뀜"으로 잡혀 매번 전체 백엔드가 불필요하게 재배포됐다 — 실측:
          # orderapi-deployment.yaml 한 파일만 바뀐 push에서도 build-push-recorder가
          # 돌아 recorder가 재배포됨, 100배속 부하테스트 도중 랙 급증으로 이어짐.
          # push 이벤트의 직전 커밋과 비교하도록 명시한다.
          base: ${{ github.event.before }}
          filters: |
            frontend: ['frontend/**']
            backend: ['backend/**']
            orderapi: ['orderapi/**']
            matching: ['matching/**']
            recorder: ['recorder/**']
            trader: ['trader/**']
            replayengine: ['replayengine/**']
            infra: ['infra/**']

  # --- 프론트 (S3 + CloudFront) ------------------------------------------

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws s3 sync frontend/dist/ s3://team1-truss-frontend/ --delete
      - run: |
          # truss.jhyang.click 배포는 오리진이 여러 개(recorder-api 등도 같은 distribution에 추가됨,
          # infra/edge.tf 참고)라 frontend S3 오리진이 Items[0]이 아닐 수 있음 — 인덱스 대신
          # 전체 오리진 목록에서 도메인으로 매칭해야 함(2026-08-19, 실제로 index 2였음).
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[*].DomainName, 'team1-truss-frontend.s3.ap-northeast-2.amazonaws.com')].Id" --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

  # --- 시세 수집기(backend) — Deployment "backend", namespace collector ---

  build-push-backend:
    # bootstrap-k8s(workflow_dispatch "전체 복구" 전용)를 기다린다 — 평소 push엔
    # bootstrap-k8s가 애초에 안 도니(skipped) 거의 지연 없이 통과하고, "전체 복구"
    # 때는 이 kubectl apply가 필요로 하는 ci-deploy-rbac.yaml이 먼저 적용돼 있어야
    # 한다(2026-08-24, EKS 전체 destroy→apply 리허설 중 발견 — bootstrap-k8s가
    # terraform-apply "다음"에만 돌게 해뒀더니, 정작 이 kubectl apply 쪽이 그보다
    # 먼저 실행되면서 RBAC 없이 막혔다).
    needs: [detect-changes, bootstrap-k8s]
    if: |
      needs.detect-changes.outputs.backend == 'true' &&
      (github.event_name != 'workflow_dispatch' || needs.bootstrap-k8s.result == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:backend-${{ github.sha }}" -t "$IMAGE:backend-latest" .
          docker push "$IMAGE:backend-${{ github.sha }}"
          docker push "$IMAGE:backend-latest"
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - run: |
          kubectl apply -f ../infra/k8s/collector/backend-deployment.yaml
          kubectl rollout restart deployment/backend -n collector
          kubectl rollout status deployment/backend -n collector --timeout=180s

  # --- 접수 API(orderapi) — Deployment "orderapi", namespace backend ------

  build-push-orderapi:
    # build-push-backend와 같은 이유(위 주석 참고) — bootstrap-k8s를 기다린다.
    needs: [detect-changes, bootstrap-k8s]
    if: |
      needs.detect-changes.outputs.orderapi == 'true' &&
      (github.event_name != 'workflow_dispatch' || needs.bootstrap-k8s.result == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orderapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orderapi/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:orderapi-${{ github.sha }}" -t "$IMAGE:orderapi-latest" .
          docker push "$IMAGE:orderapi-${{ github.sha }}"
          docker push "$IMAGE:orderapi-latest"
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - run: |
          kubectl apply -f ../infra/k8s/backend/orderapi-deployment.yaml
          kubectl rollout restart deployment/orderapi -n backend
          kubectl rollout status deployment/orderapi -n backend --timeout=180s

  # --- 매칭 엔진(matching) — Deployment "matching-engine", namespace backend

  build-push-matching:
    # build-push-backend와 같은 이유(위 주석 참고) — bootstrap-k8s를 기다린다.
    needs: [detect-changes, bootstrap-k8s]
    if: |
      needs.detect-changes.outputs.matching == 'true' &&
      (github.event_name != 'workflow_dispatch' || needs.bootstrap-k8s.result == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matching
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: matching/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:matching-${{ github.sha }}" -t "$IMAGE:matching-latest" .
          docker push "$IMAGE:matching-${{ github.sha }}"
          docker push "$IMAGE:matching-latest"
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - run: |
          kubectl apply -f ../infra/k8s/backend/matching-engine-deployment.yaml
          kubectl rollout restart deployment/matching-engine -n backend
          kubectl rollout status deployment/matching-engine -n backend --timeout=180s

  # --- 기록기(recorder) — Deployment "recorder", namespace backend --------

  build-push-recorder:
    # build-push-backend와 같은 이유(위 주석 참고) — bootstrap-k8s를 기다린다.
    needs: [detect-changes, bootstrap-k8s]
    if: |
      needs.detect-changes.outputs.recorder == 'true' &&
      (github.event_name != 'workflow_dispatch' || needs.bootstrap-k8s.result == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: recorder/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:recorder-${{ github.sha }}" -t "$IMAGE:recorder-latest" .
          docker push "$IMAGE:recorder-${{ github.sha }}"
          docker push "$IMAGE:recorder-latest"
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - run: |
          kubectl apply -f ../infra/k8s/backend/recorder-deployment.yaml
          kubectl rollout restart deployment/recorder -n backend
          kubectl rollout status deployment/recorder -n backend --timeout=180s

  # --- AI 트레이더(trader) — Job이라 재시작 불필요, 다음 실행 때 :latest를 그냥 받음

  build-push-trader:
    needs: detect-changes
    if: needs.detect-changes.outputs.trader == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: trader/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:trader-${{ github.sha }}" -t "$IMAGE:trader-latest" .
          docker push "$IMAGE:trader-${{ github.sha }}"
          docker push "$IMAGE:trader-latest"

  # --- 리플레이 엔진(replayengine) — Job이라 재시작 불필요 -------------------

  build-push-replayengine:
    needs: detect-changes
    if: needs.detect-changes.outputs.replayengine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replayengine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: replayengine/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:replayengine-${{ github.sha }}" -t "$IMAGE:replayengine-latest" .
          docker push "$IMAGE:replayengine-${{ github.sha }}"
          docker push "$IMAGE:replayengine-latest"

  # --- 인프라 — plan은 자동, apply는 infra-apply environment 승인 필요 ------

  terraform-plan:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_PLAN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: network stack plan
        working-directory: infra/network
        run: |
          set -o pipefail
          terraform init -input=false
          terraform plan -no-color | tee "$GITHUB_STEP_SUMMARY"
      - name: root stack plan
        working-directory: infra
        env:
          TF_VAR_monitoring_grafana_admin_password: ${{ secrets.MONITORING_GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -o pipefail
          terraform init -input=false
          terraform plan -no-color | tee -a "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    needs: [detect-changes, terraform-plan]
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    # 2026-08-19: 원래 environment: infra-apply로 GitHub required reviewers 승인
    # 게이트를 걸어뒀는데(사람 승인 없이는 apply 못 하게), 사용자 요청으로 자동
    # 실행하도록 뗐다 — 이 계정이 여러 팀 공유이고 이 role이 iam:*/ec2:*/eks:*
    # 등 광범위한 쓰기 권한을 갖고 있어서, plan을 사람이 안 보고 그대로 적용되는
    # 리스크를 감수하는 선택임을 알고 진행.
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: network stack apply
        working-directory: infra/network
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
      - name: root stack apply
        working-directory: infra
        env:
          TF_VAR_monitoring_grafana_admin_password: ${{ secrets.MONITORING_GRAFANA_ADMIN_PASSWORD }}
        run: |
          terraform init -input=false
          # EKS를 완전히 처음부터(access entry도 ALB도 ElastiCache도 전혀 없는
          # 상태) 복구할 때 예전엔 두 가지가 plan 자체를 통째로 막았었다
          # (2026-08-24 EKS 전체 destroy→apply 리허설 중 실제로 겪음):
          #  1) edge.tf의 data.aws_lb.orderapi/collector(ALB를 태그로 찾음)가
          #     아직 존재하지 않는 ALB를 찾다가 "Search returned 0 results"로 실패
          #  2) monitoring.tf의 redis_cpu 알람이 member_clusters(apply 전엔
          #     모르는 값)로 for_each를 돌아서 실패
          # 둘 다 2026-08-25에 코드 레벨에서 근본 수정했다 — edge.tf는
          # data.aws_lb 대신 절대 에러 없이 found=false를 반환하는
          # data.external(+ count 조건부 리소스)로, monitoring.tf의 redis_cpu는
          # member_clusters 대신 replication_group_id/num_cache_clusters(둘 다
          # apply 전에도 이미 아는 설정값)로 계산한 결정적 for_each로 바꿨다.
          # 그 결과 from-scratch 상태에서도 이 apply 한 번으로 끝난다(-target
          # 재시도 불필요, 로컬 terraform plan으로 실측 검증 완료). ALB 의존
          # 리소스(Route53/CloudFront/alb_5xx, count=0 또는 placeholder로 생성됨)는
          # 실제 ALB가 생긴 뒤 terraform-reconcile-alb job이 값을 채운다.
          terraform apply -auto-approve -input=false

  # --- 수동 "전체 복구" 전용 — 평소 push엔 절대 안 낀다 ---------------------
  #
  # namespace/RBAC/Ingress/ScaledObject/Kafka 토픽처럼, 지금까지 CI가 아니라
  # 사람이 한 번씩 손으로 kubectl apply해뒀던 나머지 매니페스트 전부(2026-08-24
  # 발견 — EKS를 지웠다 올리는 걸 검토하다가, 이 저장소가 실제로는 이것들이
  # 전혀 자동화돼 있지 않다는 걸 알게 됨). terraform-apply가 EKS 클러스터+
  # Karpenter/ALB 컨트롤러/KEDA(2026-08-24부터 helm_release로 같이 관리, karpenter.tf/
  # alb-controller.tf/k8s-addons.tf 참고)까지 다 올린 "뒤"에 돌아야 한다 — Karpenter
  # NodePool CRD는 Karpenter 차트가 설치돼야 존재하고, ScaledObject는 KEDA CRD가
  # 있어야 하기 때문.
  #
  # TF_APPLY_ROLE을 쓴다(ECR_PUSH_ROLE이 아니라) — ci-deploy-rbac.yaml 주석대로
  # ECR_PUSH_ROLE(team1-github-actions-deploy 그룹)은 일부러 Deployment/Service만
  # 건드리게 좁혀뒀고, Namespace/RBAC/Ingress/Secret처럼 민감한 리소스는 "사람이
  # 직접 적용한다"는 팀 결정이 있었다(2026-08-20) — 그 원칙을 일상적인 배포
  # 자동화에서는 그대로 지키고, 이 job은 사람이 workflow_dispatch를 명시적으로
  # 눌렀을 때만 돌며 이미 광범위한 쓰기 권한을 가진 TF_APPLY_ROLE(terraform-apply와
  # 동일)을 재사용한다 — 새로 권한을 넓히는 게 아니라 이미 있는, 사람이 수동으로
  # 트리거하는 권한을 그대로 쓰는 것.
  bootstrap-k8s:
    needs: [terraform-apply]
    # 커스텀 if 조건을 쓰면 GitHub Actions가 기본 success() 체크를 자동으로 같이
    # 걸어주지 않는다 — needs.terraform-apply.result == 'success'를 명시해야
    # terraform-apply가 실패했는데도 이 job이 그냥 도는 걸 막을 수 있다.
    if: github.event_name == 'workflow_dispatch' && needs.terraform-apply.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      # 네임스페이스부터 먼저 — 그 안의 리소스들이 존재를 전제로 한다.
      # backend는 이제 terraform(kubernetes_namespace.backend, k8s-addons.tf)이
      # 만들지만, 그 파일도 같이 적용해두면(멱등) 라벨 등이 어긋날 일이 없다.
      - name: 네임스페이스 먼저 적용
        run: |
          kubectl apply -f infra/k8s/backend/namespace.yaml
          kubectl apply -f infra/k8s/collector/namespace.yaml
          kubectl apply -f infra/k8s/ai-trader/namespace.yaml
          kubectl apply -f infra/k8s/replay/namespace.yaml
      # kafka-topic-bootstrap Job은 이름이 고정이라(재적용 시 불변 필드 에러 방지),
      # 재실행 대비로 먼저 지우고 새로 만든다 — --if-not-exists라 토픽 자체는
      # 이미 있어도 안전(kafka-admin-job.yaml 주석 참고).
      - name: Kafka 토픽 부트스트랩 Job 재실행 준비
        run: kubectl delete job kafka-topic-bootstrap -n backend --ignore-not-found
      - name: 나머지 전부 적용 (RBAC/서비스어카운트/인그레스/ScaledObject/Deployment/Kafka 토픽)
        run: |
          kubectl apply -f infra/k8s/backend/
          kubectl apply -f infra/k8s/collector/
          kubectl apply -f infra/k8s/ai-trader/
          kubectl apply -f infra/k8s/replay/
          kubectl apply -f infra/k8s/monitoring/
          kubectl apply -f infra/k8s/job-trigger-rbac.yaml
          kubectl apply -f infra/k8s/ci-deploy-rbac.yaml
          kubectl apply -f infra/k8s/karpenter/nodepool-backend.yaml
      - name: Kafka 토픽 생성 완료 대기
        run: kubectl wait --for=condition=complete job/kafka-topic-bootstrap -n backend --timeout=180s

  # --- terraform-apply 시점엔 ALB가 아직 없어 count=0/placeholder로 넘어갔던
  # Route53/CloudFront/alb_5xx 마무리(2026-08-24) — bootstrap-k8s가 방금
  # Ingress를 적용해서 이제 ALB가 실제로 존재하므로, edge.tf의
  # data.external.orderapi_alb/collector_alb가 이번엔 found=true로 찾아내고
  # 해당 리소스들이 실제 값으로 채워진다. 평소(ALB가 이미 있던 날)엔 이 job도
  # 그냥 "변경 없음"으로 조용히 끝난다 — 매번 돌아도 무해.
  terraform-reconcile-alb:
    needs: [bootstrap-k8s]
    if: github.event_name == 'workflow_dispatch' && needs.bootstrap-k8s.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - working-directory: infra
        env:
          TF_VAR_monitoring_grafana_admin_password: ${{ secrets.MONITORING_GRAFANA_ADMIN_PASSWORD }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
